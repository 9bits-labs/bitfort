[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

# No GUI crate is a member: the CLI build stays free of GUI deps (docs/SPEC.md §9).

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/9bits-labs/bitfort"
# Nothing here goes to crates.io: the supported artifact is the `bitfort` binary, and the
# crates carry no stable API (see README.md).
publish = false

# Dev builds keep file:line for panic backtraces but drop the variable/type
# DWARF only a step debugger needs - faster codegen and linking, smaller
# artifacts. Override with `debug = "full"` to run a step debugger.
[profile.dev]
debug = "line-tables-only"

# Release binaries (dist-workspace.toml).
[profile.dist]
inherits = "release"
lto = "thin"
