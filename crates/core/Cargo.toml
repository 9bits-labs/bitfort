[package]
name = "bitfort-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
age = { version = "0.11.3", features = ["armor"] }
base64 = "0.22.1"
ed25519-dalek = "2.2.0"
getrandom = "0.4.3"
hex = "0.4.3"
# `v1` pulls the platform-native store for each desktop OS - macOS Keychain, Windows
# Credential Manager, Linux Secret Service - plus the v1-compatible `Entry::new` API this
# crate uses. Named explicitly (not via default features) so trimming `default-features`
# can't silently drop the Windows/Linux stores to keyring-core's no-op mock. The resolved
# per-OS backend is guarded by tests/keyring_backends.rs.
keyring = { version = "4.1.2", default-features = false, features = ["v1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_jcs = "0.2.0"
serde_json = "1.0.150"
sha2 = "0.10"
thiserror = "2.0.18"
toml = "1.1.2"
zeroize = "1.9.0"

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3.27.0"
