[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.1"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# Where to host releases
hosting = "github"
# A GitHub build attestation (Sigstore) for each release file, made in the `host` job, the only
# job with a write token. dist writes the `gh attestation verify` command into the release notes.
github-attestations = true
github-attestations-phase = "host"
tap = "9bits-labs/homebrew-tap"
publish-jobs = ["homebrew"]
# Each pull request builds every target, so a broken platform shows before a release tag.
pr-run-mode = "upload"
# No build cache: a release binary is built from a clean checkout only.
cache-builds = false
# release.yml is edited by hand (its header says why), so dist must not rewrite it.
allow-dirty = ["ci"]

# dist 0.33.1 picks macos-14 for arm64 macOS, an image GitHub retires on 2026-11-02, and
# macos-15-intel for x86_64, which builds in about three times as long. One arm64 runner builds
# both; the x86_64 binary is a cross build, and no C code is compiled.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
