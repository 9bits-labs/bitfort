# Builds the release archives and the Homebrew formula with dist (dist-workspace.toml).
#
# A pull request to main builds every target and keeps the archives, checksums and formula as
# workflow artifacts. A pushed version tag (`v0.1.0`) also creates the GitHub Release and
# commits the formula to the tap, which needs the HOMEBREW_TAP_TOKEN secret: a token that can
# push to that repository.
#
# Derived from the workflow that `dist generate` writes for dist 0.33.1 (Copyright 2022-2024,
# axodotdev; SPDX-License-Identifier: MIT or Apache-2.0), then edited by hand so that
# lint.yml passes it. dist-workspace.toml sets `allow-dirty = ["ci"]`, so dist no longer
# rewrites this file. After a dist upgrade, generate the new file into a scratch copy and carry
# over what changed, keeping these edits:
#
# - each action is pinned to a commit SHA, and dist comes from scripts/install-dist.sh, pinned
#   to a SHA-256, instead of a `curl | sh` installer;
# - the token is read-only, except in `host`, which creates the GitHub Release;
# - no `${{ }}` expression is expanded inside a `run:` script: values reach the shell as
#   environment variables;
# - the Windows and container steps and the empty `announce` job are gone;
# - each job downloads the artifacts once: `host` attaches its first download to the release,
#   and `publish-homebrew-formula` downloads only the artifact that holds the formula;
# - no `musl-tools` install: no dependency compiles C, and the Rust musl targets link without
#   musl-gcc (add the step back with the first C dependency);
# - pull requests to main only, and a newer push to a pull request cancels the older run.
name: release

on:
  pull_request:
    branches: [main]
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  # Decides what to build: `dist plan` on a pull request, `dist host --steps=create` on a tag.
  plan:
    runs-on: ubuntu-22.04
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ !github.event.pull_request && github.ref_name || '' }}
      publishing: ${{ !github.event.pull_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dist
        run: |
          scripts/install-dist.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: plan
        env:
          TAG: ${{ !github.event.pull_request && github.ref_name || '' }}
        run: |
          if [ -n "$TAG" ]; then
            dist host --steps=create --tag="$TAG" --output-format=json > plan-dist-manifest.json
          else
            dist plan --output-format=json > plan-dist-manifest.json
          fi
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c . plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload dist-manifest.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # Builds the archive for each target on its own runner (the matrix comes from the plan).
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs: plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dist
        run: |
          scripts/install-dist.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch the plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Build artifacts
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          DIST_ARGS: ${{ matrix.dist_args }}
        run: |
          read -ra dist_args <<< "$DIST_ARGS"
          dist build ${TAG:+"--tag=$TAG"} --print=linkage --output-format=json "${dist_args[@]}" > dist-manifest.json
      - id: cargo-dist
        name: Post-build
        run: |
          {
            echo "paths<<EOF"
            dist print-upload-files-from-manifest --manifest dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # Builds what spans the targets: the combined checksums, the source archive, the formula.
  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dist
        run: |
          scripts/install-dist.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          dist build ${TAG:+"--tag=$TAG"} --output-format=json --artifacts=global > dist-manifest.json
          {
            echo "paths<<EOF"
            jq --raw-output ".upload_files[]" dist-manifest.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # On a tag only: creates the GitHub Release with every artifact attached.
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dist
        run: |
          scripts/install-dist.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Fetch artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        run: |
          dist host --tag="$TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          cat dist-manifest.json
          echo "manifest=$(jq -c . dist-manifest.json)" >> "$GITHUB_OUTPUT"
      # `dist host` also writes its manifest to target/distrib/dist-manifest.json, and the release
      # carries that file. The per-job manifests stay out of the release.
      - name: Remove the per-job manifests
        run: rm -f target/distrib/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE: ${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease }}
          ANNOUNCEMENT_TITLE: ${{ fromJson(steps.host.outputs.manifest).announcement_title }}
          ANNOUNCEMENT_BODY: ${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          gh release create "$TAG" --target "$RELEASE_COMMIT" --prerelease="$PRERELEASE" \
            --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" target/distrib/*

  # On a tag only: commits the formula to the tap with the tap's own token.
  publish-homebrew-formula:
    needs:
      - plan
      - host
    if: ${{ !fromJson(needs.plan.outputs.val).announcement_is_prerelease || fromJson(needs.plan.outputs.val).publish_prereleases }}
    runs-on: ubuntu-22.04
    env:
      PLAN: ${{ needs.plan.outputs.val }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The push below uses this token.
          persist-credentials: true
          repository: 9bits-labs/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Fetch the formula
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: artifacts-build-global
          path: Formula/
      - name: Commit the formula
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          brew update

          for release in $(echo "$PLAN" | jq --compact-output '.releases[] | select([.artifacts[] | endswith(".rb")] | any)'); do
            filename=$(echo "$release" | jq '.artifacts[] | select(endswith(".rb"))' --raw-output)
            name=${filename%.rb}
            version=$(echo "$release" | jq .app_version --raw-output)

            # Keeps the description and homepage as written in Cargo.toml.
            brew style --except-cops FormulaAudit/Homepage,FormulaAudit/Desc,FormulaAuditStrict --fix "Formula/${filename}" || true

            git add "Formula/${filename}"
            git commit -m "${name} ${version}"
          done
          git push
