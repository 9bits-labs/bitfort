# Checks that each commit in a pull request is signed off by its author (the Developer
# Certificate of Origin, see CONTRIBUTING.md). Pull requests only: a commit reaches main through
# a pull request that already passed it.
name: dco

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: dco
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The checkout is the pull request's test merge: its first parent is main, its second the
      # pull request head.
      - run: scripts/check-dco.sh HEAD^1..HEAD^2
